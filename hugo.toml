baseURL = "https://breischl.dev/"
title = "breischl.dev"
theme = "PaperMod"
paginate = 10
languageCode = "en-us"
enableGitInfo = true

[frontmatter]
  date = [":git", "date", ":fileModTime"]
  lastmod = [":git", "lastmod", ":fileModTime"]

[params]
  defaultTheme = "auto"
  mainSections = ["blog", "demos"]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  comments = true

  [params.giscus]
    repo           = "breischl/breischl.github.io"
    repoId         = "R_kgDORcBXJA"
    category       = "Blog Comments"
    categoryId     = "DIC_kwDORcBXJM4C3-9t"
    mapping        = "og:title"
    reactionsEnabled = "1"
    theme          = "preferred_color_scheme"
    lang           = "en"
    loading        = "lazy"
    crossorigin    = "anonymous"

  [params.homeInfoParams]
    Title = "BKR.dev"
    Content = "Software, projects, anything else that strikes my fancy"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 1
#  [[menu.main]]
#    name = "Projects"
#    url = "/projects/"
#    weight = 2
  [[menu.main]]
    name = "KENETH Demos"
    url = "/demos/keneth/"
    weight = 3